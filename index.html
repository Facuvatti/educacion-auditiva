<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="toggle-switch.css">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.12.1/css/all.css">   
    <title>Educación auditiva</title>
</head>
<body>
    <header>
        <h1>🎵 Educación Auditiva</h1>
        <label id="theme-toggle">
            <span class="switch"></span>
            <span id="theme-label">🌙 Modo oscuro</span>
        </label>
    </header>

    <ul id="notes"></ul>

    <aside>

        <!-- ── tonality ── -->
        <div class="control-section">
            <span class="section-title">Tonalidad</span>
            <div class="control-row">
                <label for="tonality">Clave</label>
                <select name="tonality" id="tonality">
                    <option>Tonalidad</option>
                </select>
            </div>
            <div class="control-aux">
                <button  id="tonality-random" class="btn-random" >Random</button>
                <label for="hide-tonality">Adivinar</label>
                <input type="checkbox" name="hide-tonality" id="hide-tonality" >
            </div>
            <div class="control-sub">
                <p>Cambiar cada</p>
                <input name="tonality-random-await" type="text" value="" placeholder="X" disabled>
                <p>progresiones</p>
                <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
                    <input type="checkbox" name="confirm" disabled>
                </label>
                <p style="color:red; font-weight:600;">PROXIMAMENTE FUNCIONANDO</p>
            </div>
        </div>

        <!-- ── octave ── -->
        <div class="control-section">
            <span class="section-title">Octava</span>
            <div class="control-row">
                <label for="octave">Octava</label>
                <select name="octave" id="octave">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3" selected>3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <!-- <option value="7">7</option> -->
                </select>
            </div>
            <div class="control-aux">
                <button id="octave-random" class="btn-random">Random</button>
                <label for="hide-octave">Adivinar</label>
                <input type="checkbox" name="hide-octave" id="hide-octave">
            </div>
            <div class="control-sub">
                <p>Cambiar cada</p>
                <input name="octave-random-await" type="text" value="" placeholder="X" disabled>
                <p>progresiones</p>
                <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
                    <input type="checkbox" name="confirm" disabled>
                </label>
                <p style="color:red; font-weight:600;">PROXIMAMENTE FUNCIONANDO</p>
            </div>
        </div>

        <!-- ── Notación ── -->
        <div class="control-section">
            <span class="section-title">Notación</span>
            <div class="control-row">
                <label for="notation">Sistema</label>
                <select name="notation" id="notation">
                    <option>Americana</option>
                    <option>Latina</option>
                </select>
            </div>
            <div class="control-aux">
                <label for="see-notes">Ver notas</label>
                <input name="see-notes" id="see-notes" type="checkbox">
            </div>
        </div>

        <!-- ── Progresión ── -->
        <div class="control-section">
            <span class="section-title">Progresión</span>
            <div class="control-row">
                <button id="progression">▶</button>
                <select name="progression-notes">
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
                <button style="padding: 5px" id="repeat">Repetir</button>
                <button id="save-history"><i class="fas fa-save"></i></button>
            </div>
            <div class="control-aux">
                <label for="hide-progression">Adivinar</label>
                <input type="checkbox" name="hide-progression" id="hide-progression">
            </div>
        </div>
        <div class="control-section">
            <span class="section-title">Historial</span>
            <div class="control-row">
                
                <div class="history">
                    <input name="history-date" type="date">
                    <!-- <input name="history-time" type="time">   -->
                    <select name="history">
                    </select>  
                    <button id="play-history">▶</button>
                    <button id="clear-history">🗑</button>
                </div>
            </div>
        </div>
        <!-- ── Dificultad ── -->
        <div class="control-section">
            <span class="section-title">Velocidad</span>
            <div class="control-row">
                <input type="range" name="speed" min="250" max="3000" step="250" value="1000">
                <p id="speed"></p>
            </div>
        </div>

    </aside>

    <script src="https://cdn.jsdelivr.net/npm/soundfont-player@0.12.0/dist/soundfont-player.min.js"></script>
    <script src="main.js"></script>
    <script src="darkmode.js"></script>
</body>
</html>
