<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="toggle-switch.css">
    <title>Educación auditiva</title>
</head>
<body>
    <header>
        <h1>🎵 Educación Auditiva</h1>
        <label id="theme-toggle">
            <span class="switch"></span>
            <span id="theme-label">🌙 Modo oscuro</span>
        </label>
    </header>

    <ul id="notas"></ul>

    <aside>

        <!-- ── Tonalidad ── -->
        <div class="control-section">
            <span class="section-title">Tonalidad</span>
            <div class="control-row">
                <label for="tonalidad">Clave</label>
                <select name="tonalidad" id="tonalidad">
                    <option>Tonalidad</option>
                </select>
            </div>
            <div class="control-aux">
                <button id="tonalidad-random" class="btn-random">Random</button>
                <label for="hide-tonalidad">Adivinar</label>
                <input type="checkbox" name="hide-tonalidad" id="hide-tonalidad">
            </div>
            <div class="control-sub">
                <p>Cambiar cada</p>
                <input name="tonalidad-random-await" type="text" value="" placeholder="X">
                <p>progresiones</p>
                <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
                    <input type="checkbox" name="confirm">
                </label>
            </div>
        </div>

        <!-- ── Octava ── -->
        <div class="control-section">
            <span class="section-title">Octava</span>
            <div class="control-row">
                <label for="octava">Octava</label>
                <select name="octava" id="octava">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3" selected>3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                </select>
            </div>
            <div class="control-aux">
                <button id="octava-random" class="btn-random">Random</button>
                <label for="hide-octava">Adivinar</label>
                <input type="checkbox" name="hide-octava" id="hide-octava">
            </div>
            <div class="control-sub">
                <p>Cambiar cada</p>
                <input name="octava-random-await" type="text" value="" placeholder="X">
                <p>progresiones</p>
                <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
                    <input type="checkbox" name="confirm">
                </label>
            </div>
        </div>

        <!-- ── Notación ── -->
        <div class="control-section">
            <span class="section-title">Notación</span>
            <div class="control-row">
                <label for="notation">Sistema</label>
                <select name="notation" id="notation">
                    <option>Americana</option>
                    <option>Latina</option>
                </select>
            </div>
            <div class="control-aux">
                <label for="see-notes">Ver notas</label>
                <input name="see-notes" id="see-notes" type="checkbox">
            </div>
        </div>

        <!-- ── Progresión ── -->
        <div class="control-section">
            <span class="section-title">Progresión</span>
            <div class="control-row">
                <button id="progression">▶ Progresión</button>
                <select name="progression-notes">
                    <option value="4">4 notas</option>
                    <option value="5">5 notas</option>
                </select>
            </div>
            <div class="control-aux">
                <label for="hide-progression">Adivinar</label>
                <input type="checkbox" name="hide-progression" id="hide-progression">
            </div>
        </div>

        <!-- ── Dificultad ── -->
        <div class="control-section">
            <span class="section-title">Dificultad</span>
            <div class="control-row">
                <select name="dificulty">
                    <option value="3000">Fácil — 3 seg</option>
                    <option value="2000" selected>Intermedio — 2 seg</option>
                    <option value="1000">Difícil — 1 seg</option>
                </select>
            </div>
        </div>

    </aside>

    <script src="https://cdn.jsdelivr.net/npm/soundfont-player@0.12.0/dist/soundfont-player.min.js"></script>
    <script src="main.js"></script>
    <script src="darkmode.js"></script>
</body>
</html>
