<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Educación auditiva</title>
</head>
<body>
    <div style="display:flex;">
        <label for="tonalidad">Tonalidad</label>
        <select name="tonalidad">
            <option>Tonalidad</option>
        </select>
        <button>Random</button>
        <p style="flex-direction: row; margin-right: 12px">Cambiar cada</p>
        <input name="tonalidad-random-await" type="text" value="" placeholder="X" size="1">
        <p style="flex-direction: row; margin: 12px">progresiones</p>
        <div>
            <label for="hide-tonalidad">Adivinar</label>
            <input type="checkbox" name="hide-tonalidad" id="hide-tonalidad">
        </div>
    </div>
    <div>
        <label for="octava">Octava</label>
        <select name="octava">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3" selected>3</option>
            <option value="4">4</option>
            <option value="5">5</option>
        </select>
        <button>Random</button>
        <p style="flex-direction: row; margin-right: 12px">Cambiar cada</p>
        <input name="octava-random-await" type="text" value="" placeholder="X" size="1">
        <p style="flex-direction: row; margin: 12px">progresiones</p>
        <div>
            <label for="hide-tonalidad">Adivinar</label>
            <input type="checkbox" name="hide-tonalidad" id="hide-tonalidad">
        </div>
    </div>
    <div>
        <label for="notation">Notación</label>
        <select name="notation">
            <option>Americana</option>
            <option>Latina</option>
        </select>
    </div>
    <ul id="notas">
    </ul>
    <div>
        <button id="progression">Progresión</button>
        <select name = "progression-notes">
            <option value="4">4</option>
            <option value="5">5</option>
        </select>
            <label for="hide-progression">Adivinar</label>
            <input type="checkbox" name="hide-progression" id="hide-progression">
    </div>
    <script src="https://cdn.jsdelivr.net/npm/soundfont-player@0.12.0/dist/soundfont-player.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
